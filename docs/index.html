<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peajes de Colombia — Mapa interactivo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <div class="brand">
    <span class="eyebrow">Datos abiertos · INVIAS</span>
    <h1>Peajes de Colombia</h1>
  </div>
  <nav class="site-nav">
    <a href="index.html" class="active">Mapa</a>
    <a href="ruta.html">Ruta</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="about.html">Acerca</a>
  </nav>
</header>

<div id="toolbar">
  <div class="stats" id="stats"></div>
  <div class="controls">
    <div class="select-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <select id="deptoSelect"></select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main id="main">
  <aside id="sidebar">
    <div class="sidebar-count" id="sidebarCount"></div>
    <div id="list" class="list"></div>
  </aside>
  <div id="map"></div>
</main>

<div id="detailSheet" class="detail-sheet" hidden>
  <button id="closeDetail" class="close-btn" aria-label="Cerrar">✕</button>
  <div id="detailContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
