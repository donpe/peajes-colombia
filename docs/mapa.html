<head>

<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#filtros">Saltar a los filtros</a>
<header class="bar">
  <a class="marca" href="index.html">Peajes de Colombia</a>
  <nav class="tabs" aria-label="Secciones del sitio">
    <a href="index.html">Viaje</a>
    <a href="mapa.html" aria-current="page">Mapa</a>
    <a href="dashboard.html">Datos</a>
    <a href="about.html">Acerca</a>
  </nav>
  <fieldset class="vehiculo">
    <legend>Tu vehículo</legend>
    <div class="opts">
      <label title="Automóvil, campero, camioneta"><input type="radio" name="cat" value="I"><span>I</span></label>
      <label title="Bus o camión de 2 ejes"><input type="radio" name="cat" value="II"><span>II</span></label>
      <label title="Camión de 3 ejes"><input type="radio" name="cat" value="III"><span>III</span></label>
      <label title="Camión de 4 ejes"><input type="radio" name="cat" value="IV"><span>IV</span></label>
      <label title="Camión de 5 o más ejes"><input type="radio" name="cat" value="V"><span>V</span></label>
    </div>
  </fieldset>
</header>

<main class="explorar" id="contenido">
  <aside class="lista-col" aria-label="Lista de peajes">
    <h1>Los peajes de Colombia</h1>
    <div class="filtros" id="filtros" tabindex="-1">
      <div class="select"><select id="deptoSelect" name="departamento" aria-label="Filtrar por departamento"></select></div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo de operador"></div>
      <button type="button" class="list-toggle" id="listToggle" aria-controls="list" aria-expanded="false">Ver la lista de peajes</button>
    </div>
    <div class="cuenta" id="sidebarCount" aria-live="polite"></div>
    <ul class="lista" id="list"></ul>
  </aside>

  <div class="mapa">
    <div id="map" role="region" aria-label="Mapa de peajes"></div>
    <div class="leyenda" id="leyenda" aria-label="Leyenda"></div>
    <div id="detailSheet" class="ficha" role="dialog" aria-labelledby="detailName" hidden>
      <button id="closeDetail" class="close-btn" type="button" aria-label="Cerrar ficha del peaje">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <article class="tiquete" id="detailContent"></article>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="comun.js"></script>
<script src="mapa.js"></script>
</body>
</html>
